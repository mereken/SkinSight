version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: skinsight-db
    environment:
      POSTGRES_DB: skinsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 3959
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skinsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: skinsight-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skinsight
      SPRING_DATASOURCE_USERNAME: skinsight
      SPRING_DATASOURCE_PASSWORD: skinsight123
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
