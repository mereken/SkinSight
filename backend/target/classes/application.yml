spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/skinsight?stringtype=unspecified
    username: postgres
    password: 3959
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8081

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-please
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

logging:
  level:
    com.skinsight: DEBUG
